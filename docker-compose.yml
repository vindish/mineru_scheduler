services:
  postgres:
    image: postgres:16-alpine
    container_name: mineru_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineru_scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-mineru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineru_password}
    # 端口暴露给宿主机：
    # - 默认只绑 127.0.0.1，避免数据库被外网或同局域网误连。
    # - 想让其它机器也能连，把 .env 里的 POSTGRES_BIND 改成 0.0.0.0
    # - 想换宿主机端口，改 POSTGRES_HOST_PORT（默认 5432）
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mineru} -d ${POSTGRES_DB:-mineru_scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 20

  scheduler:
    build: .
    container_name: mineru_scheduler_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MINERU_TOKEN: ${MINERU_TOKEN}
      # 统一路径配置（详见 config/settings.py）
      BASE_DIR: /app/data
      # 容器内 PDF 来源目录；默认指向 /app/data/pdf（即 ./data/pdf 挂载）
      # 若要从宿主机其它路径（如 NAS）扫描，配合下面 PDF_INPUT_HOST_DIR
      # 把宿主机目录挂进容器到 /app/input，并把 PDF_INPUT_DIRS 设成 /app/input
      PDF_INPUT_DIRS: ${PDF_INPUT_DIRS:-/app/data/pdf}
      OUTPUT_BASE_DIR: ${OUTPUT_BASE_DIR:-/app/data}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mineru_scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-mineru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineru_password}
      MINERU_DAILY_FILE_LIMIT: ${MINERU_DAILY_FILE_LIMIT:-5000}
      MINERU_MAX_FILE_PAGES: ${MINERU_MAX_FILE_PAGES:-200}
      MINERU_HIGH_PRIORITY_DAILY_PAGE_LIMIT: ${MINERU_HIGH_PRIORITY_DAILY_PAGE_LIMIT:-1000}
      MINERU_SUBMIT_FILE_RATE_PER_MINUTE: ${MINERU_SUBMIT_FILE_RATE_PER_MINUTE:-50}
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      # 可选：把宿主机的 PDF 来源（如 NAS 挂载点）映射进容器
      # 在 .env 中设置 PDF_INPUT_HOST_DIR=/mnt/nas/Study
      # 然后把 PDF_INPUT_DIRS 设成 /app/input 即可
      # bind.create_host_path=false：宿主机源不存在时直接报错，
      # 防止 docker 默默建一个空目录把问题藏起来。
      - type: bind
        source: ${PDF_INPUT_HOST_DIR:-./data/pdf}
        target: /app/input
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
